name: 每日更新机票价格

on:
  schedule:
    - cron: "0 1 * * *"      # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml
      - name: 重查价格并重建页面
        id: refresh
        run: python tools/refresh_ci.py
      - name: 提交更新
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name "flight-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 更新报价 $(date -u '+%Y-%m-%d')" || echo "nothing to commit"
          git push
